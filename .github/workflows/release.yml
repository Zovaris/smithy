name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2604
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web UI
        working-directory: web
        run: npm ci && npm run build
      - name: Harness build embeds the real web UI, not the placeholder
        run: go test -tags harness -run 'TestReleaseEmbedsBuild' ./internal/web/
        env:
          SMITHY_REQUIRE_WEB_BUILD: "1"
      - name: Tag matches VERSION
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$v" = "$(cat shared/VERSION)" ] || { echo "tag $GITHUB_REF_NAME but shared/VERSION is $(cat shared/VERSION)"; exit 1; }
      - name: Tests
        run: tests/run.sh
      - name: Build
        run: |
          mkdir dist
          for t in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}
            out="dist/smithy-$os-$arch"; [ "$os" = windows ] && out="$out.exe"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -tags harness -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "$out" ./cmd/smithy
            [ "$os" = windows ] || gzip -9 "$out"
          done
          sh scripts/fetch-ripgrep.sh dist
          tar -czf dist/smithy-skills.tar.gz -C skills --owner=0 --group=0 --numeric-owner hush ledger scout simple smelt tend use-smithy warden
          (cd dist && sha256sum * > checksums.txt)
          ls -la dist
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/smithy-*'
      - name: Release notes from CHANGELOG
        run: |
          awk -v v="## ${GITHUB_REF_NAME} " 'index($0, v) == 1 {on=1; next} /^## v/ || /^### Details/ {on=0} on' CHANGELOG.md > notes.md
          printf '\n**Full details:** [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md)\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
