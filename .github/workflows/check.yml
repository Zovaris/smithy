name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go format and vet
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go vet -tags harness ./...
      - name: Go tests (race detector, coverage)
        run: |
          go test -race -covermode=atomic -coverprofile=cover.out ./...
          total="$(go tool cover -func=cover.out | awk '/^total:/ {print $3}')"
          {
            echo "## Go coverage: $total"
            echo
            echo '| Package | Coverage |'
            echo '|---|---|'
            go test -cover ./... 2>/dev/null | awk '{pkg=$1=="ok"?$2:$1; sub("github.com/Zovaris/smithy/","",pkg); for(i=1;i<=NF;i++) if($i ~ /%$/) print "| " pkg " | " $i " |"}'
          } >> "$GITHUB_STEP_SUMMARY"
          go test -race -tags harness ./...
          awk -v t="${total%\%}" -v min="$COVERAGE_MIN" 'BEGIN { if (t+0 < min+0) { print "coverage " t "% is below " min "%"; exit 1 } }'
        env:
          COVERAGE_MIN: "60"
      - name: Integration tests (skill lint, CLI tests through the binary)
        env:
          SKIP_GO_TEST: "1"
        run: tests/run.sh
      - name: Builds on every release target
        run: |
          for t in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} go build -trimpath -ldflags "-s -w" -o /dev/null ./cmd/smithy
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -tags harness -trimpath -ldflags "-s -w" -o /dev/null ./cmd/smithy
          done
      - name: Launcher syntax
        run: |
          sh -n shared/smithy
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install.sh installs the latest release under Git Bash
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: SMITHY_HOME="$RUNNER_TEMP/home" sh install.sh
      - name: The launcher runs the installed binary and never downloads
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "%RUNNER_TEMP%\l" & copy /y shared\smithy.cmd "%RUNNER_TEMP%\l\" >nul
          for /f "delims=" %%t in ('gh release view -R Zovaris/smithy --json tagName -q .tagName') do set "tag=%%t"
          echo %tag:~1%> "%RUNNER_TEMP%\l\VERSION"
          set "SMITHY_HOME=%RUNNER_TEMP%\home"
          call "%RUNNER_TEMP%\l\smithy.cmd" version || exit /b 1
          set "SMITHY_HOME=%RUNNER_TEMP%\empty"
          call "%RUNNER_TEMP%\l\smithy.cmd" version 2> "%RUNNER_TEMP%\err.txt"
          if not errorlevel 3 ( type "%RUNNER_TEMP%\err.txt" & exit /b 1 )
          findstr /c:"is not installed" "%RUNNER_TEMP%\err.txt" || exit /b 1
