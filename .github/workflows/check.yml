name: check
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go format and vet (both builds)
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go vet -tags harness ./...
      - name: Launcher syntax
        run: sh -n shared/smithy
      - name: golangci-lint (both builds, config in .golangci.yml)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build: [skills, harness]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        if: matrix.build == 'harness'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web UI (embedded by the harness build)
        if: matrix.build == 'harness'
        working-directory: web
        run: npm ci && npm run build
      - name: Go tests, skills build (race detector, coverage)
        if: matrix.build == 'skills'
        env:
          COVERAGE_MIN: "60"
        run: |
          go test -race -covermode=atomic -coverprofile=cover.out ./...
          total="$(go tool cover -func=cover.out | awk '/^total:/ {print $3}')"
          {
            echo "## Go coverage: $total"
            echo
            echo '| Package | Coverage |'
            echo '|---|---|'
            go tool cover -func=cover.out | awk '$1 != "total:" {split($1,f,":"); pkg=f[1]; sub("/[^/]*$","",pkg); sub("github.com/Zovaris/smithy/","",pkg); n[pkg]++; s[pkg]+=$3} END {for (p in n) printf "| %s | %.1f%% |\n", p, s[p]/n[p]}' | sort
          } >> "$GITHUB_STEP_SUMMARY"
          awk -v t="${total%\%}" -v min="$COVERAGE_MIN" 'BEGIN { if (t+0 < min+0) { print "coverage " t "% is below " min "%"; exit 1 } }'
      - name: Go tests, harness build (race detector)
        if: matrix.build == 'harness'
        env:
          SMITHY_REQUIRE_WEB_BUILD: "1" # the web e2e test runs on the real build, never skips
        run: go test -race -tags harness ./...
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Integration tests (skill lint, CLI tests through the binary)
        env:
          SKIP_GO_TEST: "1"
        run: tests/run.sh
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pull requests build one target per OS; main builds every release target
        target: ${{ fromJSON(github.event_name == 'pull_request' && '["darwin/arm64","linux/amd64","windows/amd64"]' || '["darwin/arm64","darwin/amd64","linux/arm64","linux/amd64","windows/amd64"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web UI (embedded by the harness build)
        working-directory: web
        run: npm ci && npm run build
      - name: Build both builds for ${{ matrix.target }}
        run: |
          t='${{ matrix.target }}'
          GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /dev/null ./cmd/smithy
          GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -tags harness -trimpath -ldflags "-s -w" -o /dev/null ./cmd/smithy
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Web UI tests, typecheck, lint, build within budget (ADR 0010, 0011)
        working-directory: web
        run: |
          npm ci
          npm test
          npm run typecheck
          bun check
          npm run lint
          npm run build
  demo:
    # Records the v0.23 demo (demo/run.sh): the TUI tape and the web screenshots, kept as an artifact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web UI and install chromium
        working-directory: web
        run: npm ci && npm run build && npx playwright install --with-deps chromium
      - name: Install vhs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          go install github.com/charmbracelet/vhs@v0.9.0
          curl -fsSL -o /tmp/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          sudo install -m 755 /tmp/ttyd /usr/local/bin/ttyd
      - name: Record the demo
        run: PATH="$(go env GOPATH)/bin:$PATH" demo/run.sh "$RUNNER_TEMP/demo"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo
          path: ${{ runner.temp }}/demo
          if-no-files-found: error
  check:
    if: always()
    needs: [lint, test, integration, build, web, demo]
    runs-on: ubuntu-latest
    steps:
      - name: Every check job passed
        run: |
          r='${{ join(needs.*.result, ' ') }}'
          echo "results: $r"
          for x in $r; do [ "$x" = success ] || exit 1; done
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install.sh installs the latest release under Git Bash
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: SMITHY_HOME="$RUNNER_TEMP/home" sh install.sh
      - name: The launcher runs the installed binary and never downloads
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "%RUNNER_TEMP%\l" & copy /y shared\smithy.cmd "%RUNNER_TEMP%\l\" >nul
          for /f "delims=" %%t in ('gh release view -R Zovaris/smithy --json tagName -q .tagName') do set "tag=%%t"
          echo %tag:~1%> "%RUNNER_TEMP%\l\VERSION"
          set "SMITHY_HOME=%RUNNER_TEMP%\home"
          call "%RUNNER_TEMP%\l\smithy.cmd" version || exit /b 1
          if not exist "%LOCALAPPDATA%\Programs\smithy\smithy.exe" ( echo install.sh did not create the smithy command & exit /b 1 )
          set "SMITHY_HOME=%RUNNER_TEMP%\empty"
          set "LOCALAPPDATA=%RUNNER_TEMP%\empty"
          call "%RUNNER_TEMP%\l\smithy.cmd" version 2> "%RUNNER_TEMP%\err.txt"
          if not errorlevel 3 ( type "%RUNNER_TEMP%\err.txt" & exit /b 1 )
          findstr /c:"is not installed" "%RUNNER_TEMP%\err.txt" || exit /b 1
