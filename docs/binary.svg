<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How a skill runs the smithy binary</title>
  <desc>A skill calls its launcher script, which runs the one smithy binary per platform installed by install.sh from a GitHub release; the binary drives git and gh and keeps state in ~/.smithy.</desc>
  <style>
    .t { font-size: 15px; font-weight: 600; fill: #1f2328; }
    .s { font-size: 12px; fill: #59636e; }
    .c { font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #59636e; }
    .k { font-size: 10.5px; font-weight: 700; letter-spacing: .09em; fill: #8c959f; }
    .e { font-size: 11px; font-style: italic; fill: #8c959f; }
    .n { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.25; }
    .r { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.25; }
    .sm { fill: #f3f0ff; stroke: #8b7fe0; stroke-width: 1.25; }
    .w { fill: #dafbe1; stroke: #4ac26b; stroke-width: 1.25; }
    .wk { fill: #ffffff; stroke: #4ac26b; stroke-width: 1; }
    .td { fill: #fff1e5; stroke: #fb8f44; stroke-width: 1.25; }
    .m { fill: #fbefff; stroke: #a475f9; stroke-width: 1.25; }
    .g { fill: none; stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 3 4; }
    .l { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .lt { stroke: #fb8f44; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .h { fill: #8c959f; }
    .ht { fill: #fb8f44; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #f0f6fc; }
      .s, .c { fill: #9198a1; }
      .k, .e { fill: #6e7681; }
      .n { fill: #151b23; stroke: #3d444d; }
      .r { fill: #0c2d4f; stroke: #4493f8; }
      .sm { fill: #231f3d; stroke: #8b7fe0; }
      .w { fill: #0f2a19; stroke: #3fb950; }
      .wk { fill: #0d1117; stroke: #3fb950; }
      .td { fill: #3a2210; stroke: #db6d28; }
      .m { fill: #2a1a40; stroke: #ab7df8; }
      .g { stroke: #3d444d; }
      .l { stroke: #6e7681; }
      .h { fill: #6e7681; }
      .lt { stroke: #db6d28; }
      .ht { fill: #db6d28; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="h"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="ht"/></marker>
  </defs>
  <rect class="sm" x="20" y="50" width="180" height="90"/>
  <text class="t" x="110.0" y="91.0" text-anchor="middle">SKILL.md</text>
  <text class="c" x="110.0" y="112.0" text-anchor="middle">smithy wait pr:42</text>
  <text class="k" x="20" y="42" text-anchor="start">SKILL</text>
  <rect class="n" x="240" y="50" width="190" height="90"/>
  <text class="t" x="335.0" y="82.0" text-anchor="middle">scripts/smithy</text>
  <text class="s" x="335.0" y="103.0" text-anchor="middle">sh · smithy.cmd on Windows</text>
  <text class="s" x="335.0" y="120.0" text-anchor="middle">never downloads</text>
  <text class="k" x="240" y="42" text-anchor="start">LAUNCHER</text>
  <rect class="r" x="455" y="30" width="290" height="130"/>
  <text class="t" x="600.0" y="64.0" text-anchor="middle">smithy</text>
  <text class="c" x="600.0" y="85.0" text-anchor="middle">~/.local/bin/smithy →</text>
  <text class="c" x="600.0" y="102.0" text-anchor="middle">~/.local/share/smithy/versions/&lt;v&gt;/</text>
  <text class="s" x="600.0" y="119.0" text-anchor="middle">one file per platform, ~25 MB gz</text>
  <text class="s" x="600.0" y="136.0" text-anchor="middle">keeps current + previous</text>
  <text class="k" x="455" y="22" text-anchor="start">BINARY · GO</text>
  <rect class="w" x="780" y="50" width="160" height="90"/>
  <text class="t" x="860.0" y="82.0" text-anchor="middle">git · gh</text>
  <text class="s" x="860.0" y="103.0" text-anchor="middle">gh optional</text>
  <text class="s" x="860.0" y="120.0" text-anchor="middle">no node, jq or python</text>
  <text class="k" x="780" y="42" text-anchor="start">DRIVES</text>
  <path class="l" d="M200 95H238" marker-end="url(#a)"/>
  <path class="l" d="M430 95H468" marker-end="url(#a)"/>
  <path class="l" d="M745 95H778" marker-end="url(#a)"/>
  <rect class="n" x="240" y="212" width="190" height="64"/>
  <text class="t" x="335.0" y="240.0" text-anchor="middle">install.sh</text>
  <text class="s" x="335.0" y="261.0" text-anchor="middle">GitHub release · you run it once</text>
  <text class="k" x="240" y="204" text-anchor="start">INSTALL</text>
  <rect class="n" x="780" y="212" width="160" height="64"/>
  <text class="t" x="860.0" y="240.0" text-anchor="middle">~/.smithy</text>
  <text class="s" x="860.0" y="261.0" text-anchor="middle">settings · plans · keys</text>
  <text class="k" x="780" y="204" text-anchor="start">STATE</text>
  <path class="l" d="M430 244C450 244 450 200 520 162" marker-end="url(#a)"/>
  <text class="e" x="470" y="222" text-anchor="start">checksum · attestation</text>
  <path class="l" d="M680 162C700 200 740 244 778 244" marker-end="url(#a)"/>
</svg>
