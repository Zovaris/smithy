<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How a skill runs the smithy binary</title>
  <desc>A skill calls its scripts/smithy launcher; the launcher runs the installed binary, which install.sh downloaded and verified once from the GitHub release; the binary drives git and the GitHub CLI and keeps state in ~/.smithy.</desc>
  <style>
    .bg { fill: #ffffff; }
    .t { font-size: 15px; font-weight: 600; fill: #1f2328; }
    .s { font-size: 12px; fill: #59636e; }
    .m { font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1f2328; }
    .k { font-size: 11px; font-weight: 600; letter-spacing: .04em; fill: #59636e; }
    .neutral { fill: #f6f8fa; stroke: #d1d9e0; }
    .accent { fill: #ddf4ff; stroke: #54aeff; }
    .bin { fill: #f3f0ff; stroke: #8b7fe0; }
    .line { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .dash { stroke: #8c959f; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .t, .m { fill: #f0f6fc; }
      .s, .k { fill: #9198a1; }
      .neutral { fill: #151b23; stroke: #3d444d; }
      .accent { fill: #0c2d4f; stroke: #4493f8; }
      .bin { fill: #231f3d; stroke: #8b7fe0; }
      .line, .dash { stroke: #656c76; }
      .head { fill: #656c76; }
    }
  </style>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="head"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="250" rx="14"/>

  <rect class="neutral" x="24" y="40" width="190" height="92" rx="12"/>
  <text class="k" x="40" y="64">SKILL</text>
  <text class="t" x="40" y="88">SKILL.md</text>
  <text class="m" x="40" y="112">smithy wait pr:42</text>

  <rect class="accent" x="254" y="40" width="200" height="92" rx="12"/>
  <text class="k" x="270" y="64">LAUNCHER</text>
  <text class="m" x="270" y="88">scripts/smithy</text>
  <text class="s" x="270" y="112">sh · smithy.cmd on Windows</text>

  <rect class="bin" x="494" y="40" width="200" height="92" rx="12"/>
  <text class="k" x="510" y="64">BINARY · GO</text>
  <text class="m" x="510" y="88">~/.smithy/bin/&lt;version&gt;</text>
  <text class="s" x="510" y="112">one file, ~1.5 MB download</text>

  <rect class="neutral" x="734" y="40" width="202" height="92" rx="12"/>
  <text class="k" x="750" y="64">DRIVES</text>
  <text class="t" x="750" y="88">git · gh (optional)</text>
  <text class="s" x="750" y="112">no node, jq or python</text>

  <rect class="neutral" x="254" y="172" width="200" height="56" rx="12"/>
  <text class="t" x="270" y="196">install.sh · GitHub release</text>
  <text class="s" x="270" y="215">checksums · attestation</text>

  <rect class="neutral" x="494" y="172" width="200" height="56" rx="12"/>
  <text class="t" x="510" y="196">~/.smithy</text>
  <text class="s" x="510" y="215">settings · plans · cards</text>

  <path class="line" d="M214 86H252" marker-end="url(#b)"/>
  <path class="line" d="M454 86H492" marker-end="url(#b)"/>
  <path class="line" d="M694 86H732" marker-end="url(#b)"/>
  <path class="dash" d="M354 170V134" marker-end="url(#b)"/>
  <text class="s" x="362" y="158">you run it once</text>
  <path class="line" d="M594 134V170" marker-end="url(#b)"/>
</svg>
