<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How the smithy skills work together</title>
  <desc>use-smithy routes work to smelt for one task or warden for many; both share one task list; warden runs workers in worktrees; tend keeps their pull requests green until they merge.</desc>
  <style>
    .t { font-size: 15px; font-weight: 600; fill: #1f2328; }
    .s { font-size: 12px; fill: #59636e; }
    .c { font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #59636e; }
    .k { font-size: 10.5px; font-weight: 700; letter-spacing: .09em; fill: #8c959f; }
    .e { font-size: 11px; font-style: italic; fill: #8c959f; }
    .n { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.25; }
    .r { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.25; }
    .sm { fill: #f3f0ff; stroke: #8b7fe0; stroke-width: 1.25; }
    .w { fill: #dafbe1; stroke: #4ac26b; stroke-width: 1.25; }
    .wk { fill: #ffffff; stroke: #4ac26b; stroke-width: 1; }
    .td { fill: #fff1e5; stroke: #fb8f44; stroke-width: 1.25; }
    .m { fill: #fbefff; stroke: #a475f9; stroke-width: 1.25; }
    .g { fill: none; stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 3 4; }
    .l { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .lt { stroke: #fb8f44; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .h { fill: #8c959f; }
    .ht { fill: #fb8f44; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #f0f6fc; }
      .s, .c { fill: #9198a1; }
      .k, .e { fill: #6e7681; }
      .n { fill: #151b23; stroke: #3d444d; }
      .r { fill: #0c2d4f; stroke: #4493f8; }
      .sm { fill: #231f3d; stroke: #8b7fe0; }
      .w { fill: #0f2a19; stroke: #3fb950; }
      .wk { fill: #0d1117; stroke: #3fb950; }
      .td { fill: #3a2210; stroke: #db6d28; }
      .m { fill: #2a1a40; stroke: #ab7df8; }
      .g { stroke: #3d444d; }
      .l { stroke: #6e7681; }
      .h { fill: #6e7681; }
      .lt { stroke: #db6d28; }
      .ht { fill: #db6d28; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="h"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="ht"/></marker>
  </defs>
  <rect class="n" x="20" y="178" width="110" height="64"/>
  <text class="t" x="75.0" y="206.0" text-anchor="middle">You</text>
  <text class="s" x="75.0" y="227.0" text-anchor="middle">an idea or tasks</text>
  <rect class="r" x="166" y="170" width="128" height="80"/>
  <text class="t" x="230.0" y="197.0" text-anchor="middle">use-smithy</text>
  <text class="s" x="230.0" y="218.0" text-anchor="middle">picks the skill</text>
  <text class="s" x="230.0" y="235.0" text-anchor="middle">shared rules</text>
  <text class="k" x="166" y="162" text-anchor="start">ROUTE</text>
  <rect class="g" x="322" y="24" width="300" height="378"/>
  <text class="k" x="472.0" y="46" text-anchor="middle">PLAN AND BUILD</text>
  <rect class="sm" x="342" y="80" width="260" height="78"/>
  <text class="t" x="472.0" y="106.0" text-anchor="middle">smelt</text>
  <text class="s" x="472.0" y="127.0" text-anchor="middle">brainstorm → spec → TDD</text>
  <text class="s" x="472.0" y="144.0" text-anchor="middle">test agents → review → proof → PR</text>
  <text class="k" x="342" y="72" text-anchor="start">ONE TASK</text>
  <rect class="n" x="342" y="188" width="260" height="56"/>
  <text class="t" x="472.0" y="212.0" text-anchor="middle">Task list</text>
  <text class="s" x="472.0" y="233.0" text-anchor="middle">NN-slug.md · status · blocked by · PR</text>
  <rect class="w" x="342" y="284" width="260" height="104"/>
  <text class="k" x="342" y="276" text-anchor="start">MANY TASKS</text>
  <text class="t" x="472" y="309" text-anchor="middle">warden</text>
  <text class="s" x="472" y="327" text-anchor="middle">one silent worker per task, own worktree</text>
  <rect class="wk" x="360" y="341" width="70" height="30"/>
  <text class="s" x="395.0" y="361.0" text-anchor="middle">worker</text>
  <rect class="wk" x="437" y="341" width="70" height="30"/>
  <text class="s" x="472.0" y="361.0" text-anchor="middle">worker</text>
  <rect class="wk" x="514" y="341" width="70" height="30"/>
  <text class="s" x="549.0" y="361.0" text-anchor="middle">worker</text>
  <rect class="g" x="650" y="24" width="290" height="378"/>
  <text class="k" x="795.0" y="46" text-anchor="middle">SHIP</text>
  <rect class="n" x="670" y="178" width="120" height="64"/>
  <text class="t" x="730.0" y="206.0" text-anchor="middle">Pull requests</text>
  <text class="s" x="730.0" y="227.0" text-anchor="middle">one per task</text>
  <rect class="td" x="670" y="296" width="120" height="76"/>
  <text class="t" x="730.0" y="321.0" text-anchor="middle">tend</text>
  <text class="s" x="730.0" y="342.0" text-anchor="middle">CI · rebases</text>
  <text class="s" x="730.0" y="359.0" text-anchor="middle">review threads</text>
  <rect class="m" x="818" y="178" width="106" height="64"/>
  <text class="t" x="871.0" y="206.0" text-anchor="middle">Merged</text>
  <text class="s" x="871.0" y="227.0" text-anchor="middle">worktrees gone</text>
  <path class="l" d="M130 210H164" marker-end="url(#a)"/>
  <path class="l" d="M294 192C318 192 318 119 340 119" marker-end="url(#a)"/>
  <path class="l" d="M294 210H340" marker-end="url(#a)"/>
  <path class="l" d="M294 228C318 228 318 336 340 336" marker-end="url(#a)"/>
  <path class="l" d="M472 158V186" marker-end="url(#a)"/>
  <path class="l" d="M472 244V282" marker-end="url(#a)"/>
  <path class="l" d="M602 119C640 119 640 198 668 198" marker-end="url(#a)"/>
  <path class="l" d="M602 336C640 336 640 222 668 222" marker-end="url(#a)"/>
  <path class="l" d="M790 210H816" marker-end="url(#a)"/>
  <text class="e" x="480" y="177" text-anchor="start">plan</text>
  <text class="e" x="480" y="267" text-anchor="start">ready tasks</text>
  <path class="lt" d="M712 244V294" marker-end="url(#o)"/>
  <path class="lt" d="M748 294V244" marker-end="url(#o)"/>
  <text class="e" x="756" y="274" text-anchor="start">until green</text>
</svg>
