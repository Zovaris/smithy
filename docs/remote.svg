<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How remote access works</title>
  <desc>The daemon always listens on loopback with its token. tailscale serve can proxy HTTPS to it for logins in daemon.allow. daemon.listen adds a plain-HTTP listener on a Tailscale IP that accepts only paired device tokens, traded once for a five-minute one-time code from smithy pair.</desc>
  <style>
    .t { font-size: 15px; font-weight: 600; fill: #1f2328; }
    .s { font-size: 12px; fill: #59636e; }
    .c { font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #59636e; }
    .k { font-size: 10.5px; font-weight: 700; letter-spacing: .09em; fill: #8c959f; }
    .e { font-size: 11px; font-style: italic; fill: #8c959f; }
    .n { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.25; }
    .r { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.25; }
    .sm { fill: #f3f0ff; stroke: #8b7fe0; stroke-width: 1.25; }
    .w { fill: #dafbe1; stroke: #4ac26b; stroke-width: 1.25; }
    .wk { fill: #ffffff; stroke: #4ac26b; stroke-width: 1; }
    .td { fill: #fff1e5; stroke: #fb8f44; stroke-width: 1.25; }
    .m { fill: #fbefff; stroke: #a475f9; stroke-width: 1.25; }
    .g { fill: none; stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 3 4; }
    .l { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .lt { stroke: #fb8f44; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .h { fill: #8c959f; }
    .ht { fill: #fb8f44; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #f0f6fc; }
      .s, .c { fill: #9198a1; }
      .k, .e { fill: #6e7681; }
      .n { fill: #151b23; stroke: #3d444d; }
      .r { fill: #0c2d4f; stroke: #4493f8; }
      .sm { fill: #231f3d; stroke: #8b7fe0; }
      .w { fill: #0f2a19; stroke: #3fb950; }
      .wk { fill: #0d1117; stroke: #3fb950; }
      .td { fill: #3a2210; stroke: #db6d28; }
      .m { fill: #2a1a40; stroke: #ab7df8; }
      .g { stroke: #3d444d; }
      .l { stroke: #6e7681; }
      .h { fill: #6e7681; }
      .lt { stroke: #db6d28; }
      .ht { fill: #db6d28; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="h"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="ht"/></marker>
  </defs>
  <rect class="g" x="20" y="20" width="420" height="400"/>
  <text class="k" x="230.0" y="42" text-anchor="middle">THIS MACHINE</text>
  <rect class="r" x="40" y="64" width="380" height="92"/>
  <text class="t" x="230.0" y="97.0" text-anchor="middle">smithy daemon</text>
  <text class="c" x="230.0" y="118.0" text-anchor="middle">127.0.0.1:7477 (daemon.port)</text>
  <text class="s" x="230.0" y="135.0" text-anchor="middle">daemon token · local only</text>
  <rect class="w" x="40" y="196" width="380" height="92"/>
  <text class="t" x="230.0" y="220.0" text-anchor="middle">daemon.listen</text>
  <text class="s" x="230.0" y="241.0" text-anchor="middle">Tailscale IP:port, plain HTTP</text>
  <text class="s" x="230.0" y="258.0" text-anchor="middle">paired device tokens only</text>
  <text class="s" x="230.0" y="275.0" text-anchor="middle">never the daemon token or login header</text>
  <rect class="n" x="40" y="328" width="380" height="72"/>
  <text class="t" x="230.0" y="351.0" text-anchor="middle">smithy pair</text>
  <text class="s" x="230.0" y="372.0" text-anchor="middle">one-time code: 5 min, one use</text>
  <text class="s" x="230.0" y="389.0" text-anchor="middle">5 wrong codes lock an address 15 min</text>
  <rect class="g" x="520" y="20" width="420" height="400"/>
  <text class="k" x="730.0" y="42" text-anchor="middle">ON THE TAILNET</text>
  <rect class="m" x="540" y="64" width="380" height="92"/>
  <text class="t" x="730.0" y="97.0" text-anchor="middle">Phone or browser</text>
  <text class="c" x="730.0" y="118.0" text-anchor="middle">https://&lt;machine&gt;.&lt;tailnet&gt;.ts.net</text>
  <text class="s" x="730.0" y="135.0" text-anchor="middle">via tailscale serve · login in daemon.allow</text>
  <rect class="sm" x="540" y="196" width="380" height="92"/>
  <text class="t" x="730.0" y="229.0" text-anchor="middle">Other machine</text>
  <text class="c" x="730.0" y="250.0" text-anchor="middle">smithy servers add &lt;name&gt; &lt;url&gt; --code</text>
  <text class="s" x="730.0" y="267.0" text-anchor="middle">gets its own device token</text>
  <rect class="n" x="540" y="328" width="380" height="72"/>
  <text class="t" x="730.0" y="360.0" text-anchor="middle">smithy pair revoke &lt;name&gt;</text>
  <text class="s" x="730.0" y="381.0" text-anchor="middle">the token stops working at once</text>
  <path class="l" d="M538 110H422" marker-end="url(#a)"/>
  <text class="e" x="480" y="102" text-anchor="middle">HTTPS</text>
  <path class="l" d="M538 242H422" marker-end="url(#a)"/>
  <text class="e" x="480" y="234" text-anchor="middle">bearer token</text>
  <path class="lt" d="M422 364C480 364 480 270 538 260" marker-end="url(#o)"/>
  <text class="e" x="480" y="404" text-anchor="middle">code, once</text>
</svg>
